<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כיתה וירטואלית חכמה - תיקון מלא לנתוני משתמש</title>
    <!-- טעינת ספריות PDF.js ו-Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root[data-theme="light"] {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --tool-bg: #f1f5f9;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        :root[data-theme="dark"] {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --tool-bg: #111827;
            --danger-color: #f87171;
            --success-color: #34d399;
            --warning-color: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            direction: rtl;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            transition: background 0.3s;
        }

        h2, h3, h4 { color: var(--text-main); margin-top: 0; }
        .hidden { display: none !important; }

        input, select, button, textarea {
            display: block;
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            background: var(--card-bg);
            color: var(--text-main);
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover { background: var(--primary-hover); }

        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .tool-box {
            background: var(--tool-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .room-item {
            background: var(--card-bg);
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        video {
            width: 100%;
            max-height: 220px;
            background: #000;
            border-radius: 6px;
            object-fit: cover;
        }

        .chat-box {
            height: 130px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            padding: 8px;
            background: var(--card-bg);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        #whiteboard-canvas, #pdf-canvas {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: crosshair;
            display: block;
        }

        hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }
        
        .theme-toggle-btn {
            background: var(--text-muted);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 14px;
            width: auto;
            display: inline-block;
            margin: 0;
        }

        .participant-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--primary-color); margin: 0;">🎓 כיתה וירטואלית חכמה</h2>
            <button class="theme-toggle-btn" onclick="toggleTheme()">🌓 מצב כהה / בהיר</button>
        </div>

        <!-- ========== 1. מסך התחברות / הרשמה ========== -->
        <div id="auth-section" style="max-width: 400px; margin: 0 auto;">
            <h3 id="form-title" style="text-align: center;">התחברות למערכת</h3>
            <input type="email" id="email" placeholder="אימייל">
            <input type="password" id="password" placeholder="סיסמה">
            
            <div id="register-fields" class="hidden">
                <input type="text" id="full_name" placeholder="שם מלא">
                <select id="role">
                    <option value="student">תלמיד 👨‍🎓</option>
                    <option value="teacher">מורה 👨‍🏫</option>
                </select>
            </div>

            <button id="auth-action-btn" onclick="handleAuthSubmit()">התחבר</button>
            <button onclick="toggleAuthMode()" style="background: var(--text-muted);">עבור להרשמה / התחברות</button>
        </div>

        <!-- ========== 2. מסך לוח בקרה (Dashboard) ========== -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; background: var(--tool-bg); padding: 15px; border-radius: 8px;">
                <h3 id="welcome-user" style="margin: 0;">שלום, משתמש</h3>
                <button onclick="logout()" style="background: var(--danger-color); width: auto; padding: 6px 14px; margin: 0;">התנתק</button>
            </div>

            <hr>

            <div class="tool-box" style="text-align: center;">
                <h4 style="margin-bottom: 6px;">💱 שערי מטבעות חיים</h4>
                <div id="currency-rates" style="font-weight: 600; color: var(--primary-color);">טוען שערים...</div>
            </div>

            <div id="teacher-panel" class="hidden tool-box">
                <h4>👨‍🏫 פתיחת חדר חדש</h4>
                <input type="text" id="room-title-input" placeholder="שם השיעור (למשל: פיזיקה מתקדמת)">
                <button onclick="createAndOpenRoom()" style="background: var(--success-color);">פתח חדר</button>
            </div>

            <div id="student-panel">
                <h4>🏫 חדרים פעילים</h4>
                <div id="rooms-list">טוען חדרים...</div>
            </div>
        </div>

        <!-- ========== 3. מסך בתוך החדר (Classroom) ========== -->
        <div id="room-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="current-room-title" style="margin: 0; color: var(--primary-color);">שם החדר</h3>
                <button onclick="leaveRoom()" style="background: var(--warning-color); color: #000; width: auto; padding: 6px 14px; margin: 0;">צא מהחדר 🚪</button>
            </div>
            
            <div class="grid-container">
                <!-- צד שמאל -->
                <div>
                    <div style="background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px;">
                        <video id="local-video" autoplay muted></video>
                        <div id="video-user-label" style="background: rgba(0, 0, 0, 0.85); color: white; padding: 8px; font-weight: bold; text-align: center; font-size: 14px; border-top: 1px solid #333;">
                            טוען שם...
                        </div>
                    </div>

                    <!-- כפתורי שליטה במצלמה ובמיקרופון העצמי -->
                    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                        <button id="toggle-cam-btn" onclick="toggleMyCamera()" style="background: var(--warning-color); color: #000; padding: 8px;">📷 כבה מצלמה</button>
                        <button id="toggle-mic-btn" onclick="toggleMyMicrophone()" style="background: var(--warning-color); color: #000; padding: 8px;">🎤 הַשְׁתֵּק מיקרופון</button>
                    </div>

                    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                        <button onclick="startScreenShare()" style="padding: 8px;">🖥️ שתף מסך</button>
                        <button onclick="startRecording()" style="background: var(--success-color); padding: 8px;">🔴 הקלטה</button>
                        <button onclick="stopAndSaveRecording()" style="background: var(--danger-color); padding: 8px;" class="hidden" id="stop-rec-btn">⏹️ עצור הקלטה</button>
                    </div>

                    <!-- לוח לבן -->
                    <div class="tool-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <h4 style="margin: 0;">🎨 לוח לבן שיתופי</h4>
                            <div>
                                <input type="color" id="brush-color" value="#4f46e5" style="display: inline-block; width: 35px; height: 30px; padding: 0; vertical-align: middle;">
                                <button onclick="clearWhiteboard()" style="display: inline-block; width: auto; padding: 5px 10px; margin: 0; background: var(--danger-color);">נקה לוח</button>
                            </div>
                        </div>
                        <canvas id="whiteboard-canvas" height="220"></canvas>
                    </div>

                    <!-- מציג PDF -->
                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">📄 הצגת חומרי לימוד (PDF)</h4>
                        <input type="file" id="pdf-upload" accept="application/pdf" style="margin-bottom: 8px; padding: 6px;">
                        <div style="position: relative; text-align: center;">
                            <canvas id="pdf-canvas" style="max-height: 250px; object-fit: contain;"></canvas>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;" id="pdf-controls" class="hidden">
                            <button onclick="prevPage()" style="width: auto; padding: 6px 12px; margin: 0;">◀ עמוד קודם</button>
                            <span id="pdf-page-info" style="font-weight: bold; font-size: 14px;">עמוד 0 מתוך 0</span>
                            <button onclick="nextPage()" style="width: auto; padding: 6px 12px; margin: 0;">עמוד הבא ▶</button>
                        </div>
                    </div>
                </div>

                <!-- צד ימין -->
                <div>
                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">👥 משתתפים מחוברים ושליטה</h4>
                        <div id="participants-list" style="max-height: 180px; overflow-y: auto;"></div>
                    </div>

                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">💬 צ'אט כיתתי</h4>
                        <div id="chat-messages" class="chat-box"></div>
                        <input type="text" id="chat-input" placeholder="הקלד הודעה...">
                        <button onclick="sendChatMessage()" style="padding: 8px;">שלח</button>
                    </div>

                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">🧮 מחשבון מדעי</h4>
                        <input type="text" id="calc-input" placeholder="למשל: Math.sqrt(144)">
                        <button onclick="calculateMath()" style="background: #8b5cf6; padding: 8px;">חשב</button>
                        <p id="calc-result" style="font-weight: bold; font-size: 15px; color: var(--primary-color); margin: 4px 0 0 0;"></p>
                    </div>

                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">📊 מחולל גרפים</h4>
                        <input type="text" id="chart-data-input" placeholder="מספרים בפסיקים: 15,30,45,20">
                        <button onclick="generateChart()" style="background: #ec4899; padding: 8px;">צור גרף</button>
                        <canvas id="myChart" style="max-height: 120px; margin-top: 6px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- לוגיקה וסקריפטים -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://ufivtmlumzhdsljjckqv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmaXZ0bWx1bXpoZHNsampja3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MzIxMjEsImV4cCI6MjEwMzUwODEyMX0.qW-A_JdOZifQtkAmPku6XJWDV-_AVfI8M8GGMdSNLIw';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;
        let currentUserId = null;
        let currentRoomId = null;
        let currentActiveChannel = null;
        let currentUserRole = 'student';
        let mediaStream = null;
        let mediaRecorder;
        let recordedChunks = [];
        let activeChart = null;

        window.toggleTheme = function() {
            const htmlEl = document.documentElement;
            const currentTheme = htmlEl.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            checkUserSession();
            fetchCurrencyRates();
            initWhiteboard();
            initPdfUploader();
        });

        // לוח לבן
        const canvas = document.getElementById('whiteboard-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function initWhiteboard() {
            canvas.width = canvas.offsetWidth;
            canvas.height = 220;

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            
            canvas.addEventListener('touchstart', (e) => { startPosition(e.touches[0]); });
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); });
        }

        function startPosition(e) { painting = true; draw(e); }
        function endPosition() { painting = false; ctx.beginPath(); }
        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = document.getElementById('brush-color').value;

            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        window.clearWhiteboard = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // PDF Viewer
        let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;
        const pdfCanvas = document.getElementById('pdf-canvas');
        const pdfCtx = pdfCanvas.getContext('2d');

        function initPdfUploader() {
            document.getElementById('pdf-upload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file && file.type === 'application/pdf') {
                    const fileReader = new FileReader();
                    fileReader.onload = function() {
                        const typedarray = new Uint8Array(this.result);
                        pdfjsLib.getDocument(typedarray).promise.then(function(pdfDoc_) {
                            pdfDoc = pdfDoc_;
                            document.getElementById('pdf-controls').classList.remove('hidden');
                            renderPage(pageNum);
                        });
                    };
                    fileReader.readAsArrayBuffer(file);
                }
            });
        }

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: 1.0 });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderContext = { canvasContext: pdfCtx, viewport: viewport };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
            document.getElementById('pdf-page-info').innerText = `עמוד ${num} מתוך ${pdfDoc.numPages}`;
        }

        function queueRenderPage(num) {
            if (pageRendering) { pageNumPending = num; } else { renderPage(num); }
        }

        window.prevPage = function() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        window.nextPage = function() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        // פונקציית מטא-דאטה מוגנת לחלוטין מ-undefined
        async function getClientMetadata() {
            const ua = navigator.userAgent;
            let browser = "Google Chrome";
            let os = "Windows";

            if (ua.indexOf("Firefox") > -1) browser = "Firefox";
            else if (ua.indexOf("Edg") > -1) browser = "Microsoft Edge";
            else if (ua.indexOf("Chrome") > -1) browser = "Google Chrome";
            else if (ua.indexOf("Safari") > -1) browser = "Apple Safari";
            else if (ua.indexOf("OPR") > -1) browser = "Opera";

            if (ua.indexOf("Win") > -1) os = "Windows";
            else if (ua.indexOf("Mac") > -1) os = "macOS";
            else if (ua.indexOf("Linux") > -1) os = "Linux";
            else if (ua.indexOf("Android") > -1) os = "Android";
            else if (ua.indexOf("iPhone") > -1 || ua.indexOf("iPad") > -1) os = "iOS";

            let locationStr = "ישראל";
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                if (ipRes.ok) {
                    const ipData = await ipRes.json();
                    if (ipData.city && ipData.country_name) {
                        locationStr = `${ipData.city}, ${ipData.country_name}`;
                    } else if (ipData.country_name) {
                        locationStr = ipData.country_name;
                    }
                }
            } catch (e) {
                // ברירת מחדל בטוחה במקרה של חסימת רשת
            }

            const colorHash = '#' + Math.floor(Math.abs(Math.sin(currentUserId ? currentUserId.charCodeAt(0) : 1) * 16777215)).toString(16);
            return { browser, os, location: locationStr, color: colorHash };
        }

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('form-title').innerText = isRegisterMode ? 'הרשמה למערכת' : 'התחברות למערכת';
            document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-action-btn').innerText = isRegisterMode ? 'הירשם' : 'התחבר';
        }

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert('נא למלא אימייל וסיסמה');

            if (isRegisterMode) {
                const full_name = document.getElementById('full_name').value;
                const role = document.getElementById('role').value;
                if (!full_name) return alert('נא להכניס שם מלא');

                const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name, role } } });
                if (error) return alert('שגיאה בהרשמה: ' + error.message);
                alert('הירשמת בהצלחה!');
                toggleAuthMode();
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) return alert('שגיאה בהתחברות: ' + error.message);
                checkUserSession();
            }
        }

        async function checkUserSession() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { showSection('auth-section'); return; }
            currentUserId = user.id;
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (!profile) return;

            currentUserRole = profile.role;
            document.getElementById('welcome-user').innerText = `שלום, ${profile.full_name} (${profile.role === 'teacher' ? 'מורה 👨‍🏫' : 'תלמיד 👨‍🎓'})`;
            document.getElementById('teacher-panel').classList.toggle('hidden', profile.role !== 'teacher');
            showSection('dashboard-section');
            loadActiveRooms();
        }

        window.logout = async function() { await supabase.auth.signOut(); window.location.reload(); }

        async function fetchCurrencyRates() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/ILS');
                const data = await res.json();
                document.getElementById('currency-rates').innerHTML = `
                    💵 דולר: ${(1 / data.rates.USD).toFixed(2)} ₪ &nbsp;|&nbsp; 
                    💶 יורו: ${(1 / data.rates.EUR).toFixed(2)} ₪ &nbsp;|&nbsp; 
                    💷 פאונד: ${(1 / data.rates.GBP).toFixed(2)} ₪
                `;
            } catch (e) { document.getElementById('currency-rates').innerText = 'שערי מטבעות לא זמינים.'; }
        }

        window.createAndOpenRoom = async function() {
            const title = document.getElementById('room-title-input').value;
            if (!title) return alert('נא להכניס כותרת לשיעור');
            const { data, error } = await supabase.from('rooms').insert([{ title, teacher_id: currentUserId, is_active: true }]).select().single();
            if (error) return alert('שגיאה: ' + error.message);
            enterRoom(data.id, data.title);
        }

        async function loadActiveRooms() {
            const { data: rooms } = await supabase.from('rooms').select(`id, title, profiles:teacher_id (full_name)`).eq('is_active', true);
            const listEl = document.getElementById('rooms-list');
            if (!rooms || rooms.length === 0) { listEl.innerHTML = '<p style="color: var(--text-muted);">אין חדרים פעילים.</p>'; return; }
            listEl.innerHTML = rooms.map(room => `
                <div class="room-item">
                    <span><b>${room.title}</b> <span style="color: var(--text-muted); font-size: 13px;">(מורה: ${room.profiles?.full_name || 'לא ידוע'})</span></span>
                    <button onclick="enterRoom('${room.id}', '${room.title}')" style="width: auto; padding: 5px 12px; margin:0;">הכנס</button>
                </div>
            `).join('');
        }

        window.enterRoom = async function(roomId, roomTitle) {
            currentRoomId = roomId;
            showSection('room-section');
            document.getElementById('current-room-title').innerText = roomTitle;

            const meta = await getClientMetadata();
            const { data: currentProfile } = await supabase.from('profiles').select('full_name, role').eq('id', currentUserId).single();
            if (currentProfile) {
                const labelEl = document.getElementById('video-user-label');
                labelEl.innerText = `${currentProfile.full_name} (${currentProfile.role === 'teacher' ? 'מורה' : 'תלמיד'})`;
                labelEl.style.color = meta.color;
            }

            await supabase.from('room_participants').upsert([
                { 
                    room_id: roomId, 
                    user_id: currentUserId, 
                    browser: meta.browser, 
                    os: meta.os, 
                    location: meta.location, 
                    color: meta.color, 
                    cam_active: true, 
                    mic_active: true 
                }
            ], { onConflict: 'room_id, user_id' });

            fetchParticipants(roomId);
            currentActiveChannel = supabase.channel(`room_${roomId}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'room_participants', filter: `room_id=eq.${roomId}` }, (payload) => {
                    if (payload.new && payload.new.user_id === currentUserId) {
                        if (mediaStream) {
                            if (payload.new.cam_active === false) {
                                mediaStream.getVideoTracks().forEach(t => t.enabled = false);
                                document.getElementById('toggle-cam-btn').innerText = '📷 הפעל מצלמה';
                            } else if (payload.new.cam_active === true) {
                                mediaStream.getVideoTracks().forEach(t => t.enabled = true);
                                document.getElementById('toggle-cam-btn').innerText = '📷 כבה מצלמה';
                            }
                            if (payload.new.mic_active === false) {
                                mediaStream.getAudioTracks().forEach(t => t.enabled = false);
                                document.getElementById('toggle-mic-btn').innerText = '🎤 הפעל מיקרופון';
                            } else if (payload.new.mic_active === true) {
                                mediaStream.getAudioTracks().forEach(t => t.enabled = true);
                                document.getElementById('toggle-mic-btn').innerText = '🎤 הַשְׁתֵּק מיקרופון';
                            }
                        }
                    }
                    fetchParticipants(roomId);
                })
                .subscribe();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = mediaStream;
            } catch (e) {}
        }

        window.toggleMyCamera = async function() {
            if (!mediaStream) return;
            const videoTrack = mediaStream.getVideoTracks()[0];
            if (!videoTrack) return;
            videoTrack.enabled = !videoTrack.enabled;
            const isEnabled = videoTrack.enabled;
            document.getElementById('toggle-cam-btn').innerText = isEnabled ? '📷 כבה מצלמה' : '📷 הפעל מצלמה';

            await supabase.from('room_participants').update({ cam_active: isEnabled }).match({ room_id: currentRoomId, user_id: currentUserId });
        }

        window.toggleMyMicrophone = async function() {
            if (!mediaStream) return;
            const audioTrack = mediaStream.getAudioTracks()[0];
            if (!audioTrack) return;
            audioTrack.enabled = !audioTrack.enabled;
            const isEnabled = audioTrack.enabled;
            document.getElementById('toggle-mic-btn').innerText = isEnabled ? '🎤 הַשְׁתֵּק מיקרופון' : '🎤 הפעל מיקרופון';

            await supabase.from('room_participants').update({ mic_active: isEnabled }).match({ room_id: currentRoomId, user_id: currentUserId });
        }

        window.teacherToggleUserCam = async function(targetUserId, currentCamState) {
            if (currentUserRole !== 'teacher') return;
            await supabase.from('room_participants').update({ cam_active: !currentCamState }).match({ room_id: currentRoomId, user_id: targetUserId });
        }

        window.teacherToggleUserMic = async function(targetUserId, currentMicState) {
            if (currentUserRole !== 'teacher') return;
            await supabase.from('room_participants').update({ mic_active: !currentMicState }).match({ room_id: currentRoomId, user_id: targetUserId });
        }

        async function fetchParticipants(roomId) {
            const { data } = await supabase.from('room_participants').select(`*, profiles:user_id (full_name, role)`).eq('room_id', roomId);
            const listContainer = document.getElementById('participants-list');
            if (!data) return;

            listContainer.innerHTML = data.map(p => {
                const userBrowser = p.browser && p.browser !== 'undefined' ? p.browser : 'Google Chrome';
                const userLocation = p.location && p.location !== 'undefined' ? p.location : 'ישראל';
                const userOs = p.os && p.os !== 'undefined' ? p.os : 'Windows';

                return `
                    <div class="participant-card">
                        <div>
                            <b style="color: ${p.color || '#000'}">👤 ${p.profiles?.full_name || 'משתמש'} (${p.profiles?.role === 'teacher' ? 'מורה' : 'תלמיד'})</b><br>
                            <span style="font-size: 11px; color: var(--text-muted);">
                                🌍 ${userLocation} | 💻 ${userBrowser} / ${userOs}<br>
                                מצלמה: ${p.cam_active !== false ? '🟢 פתוחה' : '🔴 כבויה'} | מיקרופון: ${p.mic_active !== false ? '🟢 פעיל' : '🔴 מושתק'}
                            </span>
                        </div>
                        ${currentUserRole === 'teacher' && p.user_id !== currentUserId ? `
                            <div style="display: flex; gap: 4px; flex-direction: column;">
                                <button onclick="teacherToggleUserCam('${p.user_id}', ${p.cam_active !== false})" style="font-size: 11px; padding: 4px 8px; margin: 0; background: ${p.cam_active !== false ? 'var(--danger-color)' : 'var(--success-color)'};">
                                    ${p.cam_active !== false ? 'כבה מצלמה' : 'הפעל מצלמה'}
                                </button>
                                <button onclick="teacherToggleUserMic('${p.user_id}', ${p.mic_active !== false})" style="font-size: 11px; padding: 4px 8px; margin: 0; background: ${p.mic_active !== false ? 'var(--danger-color)' : 'var(--success-color)'};">
                                    ${p.mic_active !== false ? 'השתק מיקרופון' : 'הפעל מיקרופון'}
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        window.startScreenShare = async function() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                document.getElementById('local-video').srcObject = stream;
            } catch (e) {}
        }

        window.startRecording = function() {
            const stream = document.getElementById('local-video').srcObject;
            if (!stream) return alert('אין וידאו להקלטה');
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'lesson.webm';
                a.click();
            };
            mediaRecorder.start();
            document.getElementById('stop-rec-btn').classList.remove('hidden');
        }

        window.stopAndSaveRecording = function() {
            if (mediaRecorder) { mediaRecorder.stop(); document.getElementById('stop-rec-btn').classList.add('hidden'); }
        }

        window.calculateMath = function() {
            try { document.getElementById('calc-result').innerText = `= ${eval(document.getElementById('calc-input').value)}`; }
            catch (e) { document.getElementById('calc-result').innerText = 'שגיאה'; }
        }

        window.generateChart = function() {
            const dataArr = document.getElementById('chart-data-input').value.split(',').map(Number);
            const ctxChart = document.getElementById('myChart').getContext('2d');
            if (activeChart) activeChart.destroy();
            activeChart = new Chart(ctxChart, {
                type: 'bar',
                data: { labels: dataArr.map((_, i) => i+1), datasets: [{ data: dataArr, backgroundColor: '#4f46e5' }] }
            });
        }

        window.sendChatMessage = function() {
            const input = document.getElementById('chat-input');
            if(!input.value) return;
            document.getElementById('chat-messages').innerHTML += `<div><b>אני:</b> ${input.value}</div>`;
            input.value = '';
        }

        window.leaveRoom = async function() {
            if (currentActiveChannel) supabase.removeChannel(currentActiveChannel);
            if (currentRoomId && currentUserId) await supabase.from('room_participants').delete().match({ room_id: currentRoomId, user_id: currentUserId });
            showSection('dashboard-section');
            loadActiveRooms();
        }

        function showSection(id) {
            ['auth-section', 'dashboard-section', 'room-section'].forEach(sec => document.getElementById(sec).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
