<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כיתה וירטואלית חכמה - פרימיום מלא</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root[data-theme="light"] {
            --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f8fafc; --card: #ffffff;
            --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --tool: #f1f5f9;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        :root[data-theme="dark"] {
            --primary: #6366f1; --primary-hover: #4f46e5; --bg: #0f172a; --card: #1e293b;
            --text: #f8fafc; --muted: #94a3b8; --border: #334155; --tool: #111827;
            --danger: #f87171; --success: #34d399; --warning: #fbbf24;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s; }
        .container { max-width: 1300px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2, h3, h4 { color: var(--text); margin-top: 0; }
        .hidden { display: none !important; }
        input, select, button, textarea { display: block; width: 100%; margin-bottom: 12px; padding: 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--card); color: var(--text); outline: none; }
        button { background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .grid-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-container { grid-template-columns: 1fr; } }
        .tool-box { background: var(--tool); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        .room-item, .participant-card { background: var(--card); padding: 10px 14px; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        video { width: 100%; max-height: 180px; background: #000; border-radius: 6px; object-fit: cover; }
        .chat-box { height: 120px; overflow-y: auto; border: 1px solid var(--border); padding: 8px; background: var(--card); border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
        #whiteboard-canvas { width: 100%; height: 350px; background: #fff; border: 1px solid var(--border); border-radius: 6px; cursor: crosshair; display: block; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        .top-bar-btn { background: var(--muted); color: #fff; padding: 6px 12px; border-radius: 6px; width: auto; display: inline-block; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container" id="main-app-container">
        <!-- סרגל עליון -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--primary); margin: 0;" data-i18n="app_title">🎓 כיתה וירטואלית חכמה</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="global-lang-select" class="top-bar-btn" style="margin:0; padding: 5px 10px;" onchange="changeAppLanguage(this.value)">
                    <option value="he">🇮🇱 עברית</option>
                    <option value="en">🇺🇸 English</option>
                </select>
                <button class="top-bar-btn" onclick="toggleTheme()" data-i18n="toggle_theme">🌓 מצב כהה / בהיר</button>
            </div>
        </div>

        <!-- התחברות -->
        <div id="auth-section" style="max-width: 400px; margin: 0 auto;">
            <h3 id="form-title" style="text-align: center;" data-i18n="auth_login_title">התחברות למערכת</h3>
            <input type="email" id="email" data-i18n-placeholder="placeholder_email" placeholder="אימייל">
            <input type="password" id="password" data-i18n-placeholder="placeholder_password" placeholder="סיסמה">
            <div id="register-fields" class="hidden">
                <input type="text" id="full_name" data-i18n-placeholder="placeholder_fullname" placeholder="שם מלא">
                <select id="role">
                    <option value="student" data-i18n="role_student">תלמיד 👨‍🎓</option>
                    <option value="teacher" data-i18n="role_teacher">מורה 👨‍🏫</option>
                </select>
            </div>
            <button id="auth-action-btn" onclick="handleAuthSubmit()" data-i18n="btn_login">התחבר</button>
            <button onclick="toggleAuthMode()" style="background: var(--muted);" data-i18n="btn_toggle_auth">עבור להרשמה / התחברות</button>
        </div>

        <!-- לוח בקרה ראשי -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; background: var(--tool); padding: 15px; border-radius: 8px;">
                <h3 id="welcome-user" style="margin: 0;">שלום</h3>
                <button onclick="logout()" style="background: var(--danger); width: auto; padding: 6px 14px; margin: 0;" data-i18n="btn_logout">התנתק</button>
            </div>
            <hr>
            <div id="teacher-panel" class="hidden tool-box">
                <h4 data-i18n="teacher_open_room">👨‍🏫 פתיחת חדר חדש</h4>
                <input type="text" id="room-title-input" data-i18n-placeholder="placeholder_room_title" placeholder="שם השיעור">
                <button onclick="createAndOpenRoom()" style="background: var(--success);" data-i18n="btn_open_room">פתח חדר</button>
            </div>
            <div id="student-panel">
                <h4 data-i18n="active_rooms">🏫 חדרים פעילים</h4>
                <div id="rooms-list" data-i18n="loading_rooms">טוען חדרים...</div>
            </div>
        </div>

        <!-- חדר המתנה -->
        <div id="waiting-room-section" class="hidden" style="text-align: center; padding: 40px;">
            <h3 style="color: var(--warning);" data-i18n="waiting_teacher_approval">⏳ ממתין לאישור המורה...</h3>
            <button onclick="leaveRoom()" style="max-width: 200px; margin: 20px auto; background: var(--danger);" data-i18n="btn_cancel_leave">בטל ועזוב</button>
        </div>

        <!-- חלון השיעור המלא -->
        <div id="room-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="current-room-title" style="margin: 0; color: var(--primary);">שם החדר</h3>
                <div>
                    <button id="raise-hand-btn" onclick="toggleRaiseHand()" style="display: inline-block; width: auto; padding: 6px 14px; background: var(--warning); color: #000;" data-i18n="btn_raise_hand">🙋‍♂️ הרם יד</button>
                    <button onclick="leaveRoom()" style="display: inline-block; width: auto; padding: 6px 14px; background: var(--danger); margin-left: 8px;" data-i18n="btn_leave_room">צא מהחדר 🚪</button>
                </div>
            </div>

            <div class="grid-container">
                <!-- עמודה שמאלית: וידאו, מצגת ולוח לבן -->
                <div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <div style="background: #000; border-radius: 8px; overflow: hidden;">
                            <video id="local-video" autoplay muted></video>
                            <div style="background: rgba(0,0,0,0.85); color: #fff; padding: 4px; text-align: center; font-size: 12px;">מצלמה שלי 🎥</div>
                        </div>
                        <div style="background: #000; border-radius: 8px; overflow: hidden;">
                            <video id="remote-video" autoplay></video>
                            <div style="background: rgba(0,0,0,0.85); color: #fff; padding: 4px; text-align: center; font-size: 12px;">מורה / תלמיד 👥</div>
                        </div>
                    </div>

                    <!-- פאנל מצגות PDF -->
                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;" data-i18n="pdf_title">📁 הצגת מצגת / קובץ PDF</h4>
                        <input type="file" id="pdf-upload-input" accept="application/pdf" onchange="loadPdfFile(event)">
                        <div style="text-align: center; margin-top: 8px;" id="pdf-controls" class="hidden">
                            <button onclick="prevPdfPage()" style="display:inline-block; width:auto; padding:4px 10px;">⬅️ הקודם</button>
                            <span id="pdf-page-num" style="margin: 0 10px; font-weight: bold;">עמוד 1</span>
                            <button onclick="nextPdfPage()" style="display:inline-block; width:auto; padding:4px 10px;">הבא ➡️</button>
                        </div>
                        <canvas id="pdf-canvas" class="hidden" style="width:100%; max-height:300px; border:1px solid var(--border); margin-top:8px; border-radius:6px;"></canvas>
                    </div>

                    <!-- לוח לבן שיתופי -->
                    <div class="tool-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <h4 style="margin: 0;" data-i18n="whiteboard_title">🎨 לוח לבן שיתופי</h4>
                            <button onclick="clearWhiteboard()" style="width: auto; padding: 2px 8px; background: var(--danger); font-size: 12px; margin:0;" data-i18n="btn_clear_board">נקה לוח</button>
                        </div>
                        <canvas id="whiteboard-canvas"></canvas>
                    </div>
                </div>

                <!-- עמודה ימנית: תלמידים ממתינים, משתתפים וצ'אט -->
                <div>
                    <div class="tool-box hidden" id="teacher-waiting-box">
                        <h4 style="margin-bottom: 8px; color: var(--warning);" data-i18n="waiting_students_title">⏳ תלמידים ממתינים</h4>
                        <div id="waiting-students-list" data-i18n="no_waiting_students">אין תלמידים ממתינים.</div>
                    </div>

                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;" data-i18n="participants_title">👥 משתתפים בכיתה</h4>
                        <div id="participants-list" style="max-height: 150px; overflow-y: auto;"></div>
                    </div>

                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;" data-i18n="chat_title">💬 צ'אט כיתתי</h4>
                        <div id="chat-messages" class="chat-box"></div>
                        <input type="text" id="chat-input" data-i18n-placeholder="placeholder_chat" placeholder="הקלד הודעה...">
                        <button onclick="sendChatMessage()" style="padding: 6px;" data-i18n="btn_send">שלח</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient('https://ufivtmlumzhdsljjckqv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmaXZ0bWx1bXpoZHNsampja3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MzIxMjEsImV4cCI6MjEwMzUwODEyMX0.qW-A_JdOZifQtkAmPku6XJWDV-_AVfI8M8GGMdSNLIw');

        const translations = {
            he: {
                app_title: "🎓 כיתה וירטואלית חכמה",
                toggle_theme: "🌓 מצב כהה / בהיר",
                auth_login_title: "התחברות למערכת",
                auth_register_title: "הרשמה למערכת",
                placeholder_email: "אימייל",
                placeholder_password: "סיסמה",
                placeholder_fullname: "שם מלא",
                role_student: "תלמיד 👨‍🎓",
                role_teacher: "מורה 👨‍🏫",
                btn_login: "התחבר",
                btn_register: "הירשם",
                btn_toggle_auth: "עבור להרשמה / התחברות",
                btn_logout: "התנתק",
                teacher_open_room: "👨‍🏫 פתיחת חדר חדש",
                placeholder_room_title: "שם השיעור",
                btn_open_room: "פתח חדר",
                active_rooms: "🏫 חדרים פעילים",
                loading_rooms: "טוען חדרים...",
                waiting_teacher_approval: "⏳ ממתין לאישור המורה...",
                btn_cancel_leave: "בטל ועזוב",
                btn_raise_hand: "🙋‍♂️ הרם יד",
                btn_leave_room: "צא מהחדר 🚪",
                pdf_title: "📁 הצגת מצגת / קובץ PDF",
                whiteboard_title: "🎨 לוח לבן שיתופי",
                btn_clear_board: "נקה לוח",
                waiting_students_title: "⏳ תלמידים ממתינים",
                no_waiting_students: "אין תלמידים ממתינים.",
                participants_title: "👥 משתתפים בכיתה",
                chat_title: "💬 צ'אט כיתתי",
                placeholder_chat: "הקלד הודעה...",
                btn_send: "שלח"
            },
            en: {
                app_title: "🎓 Smart Virtual Classroom",
                toggle_theme: "🌓 Dark / Light Mode",
                auth_login_title: "System Login",
                auth_register_title: "System Registration",
                placeholder_email: "Email",
                placeholder_password: "Password",
                placeholder_fullname: "Full Name",
                role_student: "Student 👨‍🎓",
                role_teacher: "Teacher 👨‍🏫",
                btn_login: "Login",
                btn_register: "Register",
                btn_toggle_auth: "Switch Login / Register",
                btn_logout: "Logout",
                teacher_open_room: "👨‍🏫 Open New Room",
                placeholder_room_title: "Lesson Name",
                btn_open_room: "Open Room",
                active_rooms: "🏫 Active Rooms",
                loading_rooms: "Loading rooms...",
                waiting_teacher_approval: "⏳ Waiting for teacher approval...",
                btn_cancel_leave: "Cancel & Leave",
                btn_raise_hand: "Raise Hand",
                btn_leave_room: "Leave Room",
                pdf_title: "📁 PDF Presentation",
                whiteboard_title: "Collaborative Whiteboard",
                btn_clear_board: "Clear Board",
                waiting_students_title: "Waiting Students",
                no_waiting_students: "No waiting students.",
                participants_title: "Participants",
                chat_title: "Class Chat",
                placeholder_chat: "Type a message...",
                btn_send: "Send"
            }
        };

        let currentLang = 'he';
        window.changeAppLanguage = function(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang]?.[key]) el.textContent = translations[lang][key];
            });
        };

        window.toggleTheme = function() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        };

        let isRegisterMode = false;
        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('form-title').textContent = isRegisterMode ? translations[currentLang].auth_register_title : translations[currentLang].auth_login_title;
            document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-action-btn').textContent = isRegisterMode ? translations[currentLang].btn_register : translations[currentLang].btn_login;
        };

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert("נא למלא אימייל וסיסמה.");

            if (isRegisterMode) {
                const full_name = document.getElementById('full_name').value || "משתמש";
                const role = document.getElementById('role').value;
                const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name, role } } });
                if (error) alert(error.message);
                else alert("נרשמת בהצלחה! התחבר כעת.");
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else checkUserSession();
            }
        };

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.reload();
        };

        let currentUser = null;
        let currentRoomId = null;

        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('welcome-user').textContent = `שלום, ${currentUser.user_metadata?.full_name || currentUser.email} (${currentUser.user_metadata?.role === 'teacher' ? 'מורה' : 'תלמיד'})`;
                
                if (currentUser.user_metadata?.role === 'teacher') {
                    document.getElementById('teacher-panel').classList.remove('hidden');
                }
                loadActiveRooms();
            }
        }

        async function loadActiveRooms() {
            const { data } = await supabase.from('rooms').select('*').order('created_at', { ascending: false });
            const listEl = document.getElementById('rooms-list');
            if (!data || data.length === 0) {
                listEl.innerHTML = "<p style='color:var(--muted);'>אין חדרים פעילים כרגע.</p>";
                return;
            }
            listEl.innerHTML = data.map(r => `
                <div class="room-item">
                    <span>📚 <b>${r.title}</b> (מורה: ${r.teacher_name || 'כללי'})</span>
                    <button onclick="joinRoom('${r.id}', '${r.title}')" style="width: auto; padding: 6px 14px; margin:0;">הכנס לשיעור 🚀</button>
                </div>
            `).join('');
        }

        window.createAndOpenRoom = async function() {
            const title = document.getElementById('room-title-input').value;
            if (!title) return alert("נא להזין שם שיעור.");
            const { data, error } = await supabase.from('rooms').insert([{
                title, teacher_id: currentUser.id, teacher_name: currentUser.user_metadata?.full_name
            }]).select();
            if (error) alert(error.message);
            else if (data?.[0]) joinRoom(data[0].id, data[0].title);
        };

        window.joinRoom = async function(roomId, roomTitle) {
            currentRoomId = roomId;
            document.getElementById('dashboard-section').classList.add('hidden');
            
            const isTeacher = currentUser.user_metadata?.role === 'teacher';
            if (!isTeacher) {
                document.getElementById('waiting-room-section').classList.remove('hidden');
                await supabase.from('room_participants').upsert([{
                    room_id: roomId, user_id: currentUser.id, user_name: currentUser.user_metadata?.full_name,
                    role: 'student', status: 'waiting'
                }], { onConflict: 'room_id,user_id' });
                subscribeToWaitingStatus(roomId);
            } else {
                await enterClassroom(roomId, roomTitle);
            }
        };

        function subscribeToWaitingStatus(roomId) {
            supabase.channel(`waiting-${roomId}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'room_participants', filter: `room_id=eq.${roomId}` }, payload => {
                    if (payload.new.user_id === currentUser.id && payload.new.status === 'approved') {
                        document.getElementById('waiting-room-section').classList.add('hidden');
                        enterClassroom(roomId, "כיתה פעילה");
                    }
                }).subscribe();
        }

        let localStream = null;
        let peerConnection;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function enterClassroom(roomId, roomTitle) {
            document.getElementById('waiting-room-section').classList.add('hidden');
            document.getElementById('room-section').classList.remove('hidden');
            document.getElementById('current-room-title').textContent = roomTitle;

            const isTeacher = currentUser.user_metadata?.role === 'teacher';
            if (isTeacher) {
                document.getElementById('teacher-waiting-box').classList.remove('hidden');
            }

            await supabase.from('room_participants').upsert([{
                room_id: roomId, user_id: currentUser.id, user_name: currentUser.user_metadata?.full_name,
                role: isTeacher ? 'teacher' : 'student', status: 'approved'
            }], { onConflict: 'room_id,user_id' });

            setupRealtimeClassroom(roomId);
            await initWebcamAndP2P(roomId, isTeacher);
            initWhiteboard();
        }

        async function initWebcamAndP2P(roomId, isTeacher) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;

                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = e => {
                    document.getElementById('remote-video').srcObject = e.streams[0];
                };

                peerConnection.onicecandidate = async e => {
                    if (e.candidate) {
                        await supabase.from('webrtc_signals').insert([{ room_id: roomId, sender_id: currentUser.id, candidate: JSON.stringify(e.candidate) }]);
                    }
                };

                supabase.channel(`webrtc-${roomId}`)
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'webrtc_signals', filter: `room_id=eq.${roomId}` }, async payload => {
                        if (payload.new.sender_id === currentUser.id) return;
                        const data = payload.new;

                        if (data.offer) {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);
                            await supabase.from('webrtc_signals').insert([{ room_id: roomId, sender_id: currentUser.id, answer: JSON.stringify(answer) }]);
                        } else if (data.answer && !peerConnection.currentRemoteDescription) {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer)));
                        } else if (data.candidate) {
                            try {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(data.candidate)));
                            } catch (err) { console.error(err); }
                        }
                    }).subscribe();

                if (isTeacher) {
                    setTimeout(async () => {
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        await supabase.from('webrtc_signals').insert([{ room_id: roomId, sender_id: currentUser.id, offer: JSON.stringify(offer) }]);
                    }, 2000);
                }
            } catch (err) { console.error("Webcam / P2P error:", err); }
        }

        window.leaveRoom = async function() {
            if (currentRoomId) {
                await supabase.from('room_participants').delete().match({ room_id: currentRoomId, user_id: currentUser.id });
            }
            window.location.reload();
        };

        // לוח לבן
        let canvas, ctx, drawing = false;
        function initWhiteboard() {
            canvas = document.getElementById('whiteboard-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth - 30;

            canvas.addEventListener('mousedown', () => drawing = true);
            canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
            canvas.addEventListener('mousemove', e => {
                if (!drawing) return;
                const rect = canvas.getBoundingClientRect();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#4f46e5';
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            });
        }
        window.clearWhiteboard = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };

        // ניהול קבצי PDF
        let pdfDoc = null, pageNum = 1;
        window.loadPdfFile = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdfDoc = pdf;
                    pageNum = 1;
                    document.getElementById('pdf-controls').classList.remove('hidden');
                    document.getElementById('pdf-canvas').classList.remove('hidden');
                    renderPdfPage(pageNum);
                });
            };
            fileReader.readAsArrayBuffer(file);
        };
        function renderPdfPage(num) {
            pdfDoc.getPage(num).then(page => {
                const canvas = document.getElementById('pdf-canvas');
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1.2 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                page.render({ canvasContext: ctx, viewport: viewport });
                document.getElementById('pdf-page-num').textContent = `עמוד ${num} מתוך ${pdfDoc.numPages}`;
            });
        }
        window.prevPdfPage = function() { if (pageNum > 1) renderPdfPage(--pageNum); };
        window.nextPdfPage = function() { if (pdfDoc && pageNum < pdfDoc.numPages) renderPdfPage(++pageNum); };

        function setupRealtimeClassroom(roomId) {
            supabase.channel(`room-sync-${roomId}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'room_participants', filter: `room_id=eq.${roomId}` }, () => {
                    loadParticipants(roomId);
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` }, payload => {
                    const box = document.getElementById('chat-messages');
                    box.innerHTML += `<div><b>${payload.new.user_name}:</b> ${payload.new.message}</div>`;
                    box.scrollTop = box.scrollHeight;
                })
                .subscribe();

            loadParticipants(roomId);
        }

        async function loadParticipants(roomId) {
            const { data } = await supabase.from('room_participants').select('*').eq('room_id', roomId);
            const listEl = document.getElementById('participants-list');
            const waitingEl = document.getElementById('waiting-students-list');
            if (!data) return;

            listEl.innerHTML = data.filter(p => p.status === 'approved').map(p => `
                <div class="participant-card">
                    <span>${p.user_name} (${p.role === 'teacher' ? 'מורה' : 'תלמיד'})</span>
                </div>
            `).join('');

            if (waitingEl) {
                const waiting = data.filter(p => p.status === 'waiting');
                waitingEl.innerHTML = waiting.length === 0 ? "אין תלמידים ממתינים." : waiting.map(w => `
                    <div class="participant-card">
                        <span>${w.user_name}</span>
                        <button onclick="approveStudent('${w.user_id}')" style="width:auto; padding:2px 6px; font-size:11px; background:var(--success); margin:0;">אשר ✅</button>
                    </div>
                `).join('');
            }
        }

        window.approveStudent = async function(userId) {
            const { error } = await supabase.from('room_participants')
                .update({ status: 'approved' })
                .match({ room_id: currentRoomId, user_id: userId });
            if (error) alert("שגיאה באישור התלמיד: " + error.message);
        };

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input');
            if (!input.value) return;
            await supabase.from('messages').insert([{
                room_id: currentRoomId, user_name: currentUser.user_metadata?.full_name || "משתמש", message: input.value
            }]);
            input.value = '';
        };

        window.toggleRaiseHand = async function() {
            alert("🙋‍♂️ היד הונפה בהצלחה!");
        };

        window.addEventListener('load', () => {
            checkUserSession();
            changeAppLanguage('he');
        });
    </script>
</body>
</html>
