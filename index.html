    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // ⚠️ הכנס כאן את פרטי הפרויקט שלך
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;
        let currentUserId = null;
        let currentRoomId = null;
        let currentActiveChannel = null;

        window.addEventListener('DOMContentLoaded', async () => {
            checkUserSession();
        });

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            // התיקון כאן למטה:
            document.getElementById('form-title').innerText = isRegisterMode ? 'הרשמה למערכת' : 'התחברות למערכת';
            document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-action-btn').innerText = isRegisterMode ? 'הירשם' : 'התחבר';
        }

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                return alert('נא למלא אימייל וסיסמה');
            }

            if (isRegisterMode) {
                const full_name = document.getElementById('full_name').value;
                const role = document.getElementById('role').value;

                if (!full_name) return alert('נא להכניס שם מלא');

                const { data, error } = await supabase.auth.signUp({
                    email, password,
                    options: { data: { full_name, role } }
                });
                if (error) return alert('שגיאה בהרשמה: ' + error.message);
                alert('הירשמת בהצלחה! כעת תוכל להתחבר.');
                toggleAuthMode();
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) return alert('שגיאה בהתחברות: ' + error.message);
                checkUserSession();
            }
        }

        async function checkUserSession() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                showSection('auth-section');
                return;
            }

            currentUserId = user.id;

            const { data: profile, error } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (error || !profile) {
                console.error('שגיאה בטעינת פרופיל:', error);
                return;
            }

            document.getElementById('welcome-user').innerText = `שלום, ${profile.full_name} (${profile.role === 'teacher' ? 'מורה 👨‍🏫' : 'תלמיד 👨‍🎓'})`;
            document.getElementById('teacher-panel').classList.toggle('hidden', profile.role !== 'teacher');
            
            showSection('dashboard-section');
            loadActiveRooms();
        }

        window.logout = async function() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        window.createAndOpenRoom = async function() {
            const title = document.getElementById('room-title-input').value;
            if (!title) return alert('נא להכניס כותרת לשיעור');

            const { data, error } = await supabase
                .from('rooms')
                .insert([{ title, teacher_id: currentUserId, is_active: true }])
                .select()
                .single();

            if (error) return alert('שגיאה ביצירת החדר: ' + error.message);
            enterRoom(data.id, data.title);
        }

        async function loadActiveRooms() {
            const { data: rooms, error } = await supabase
                .from('rooms')
                .select(`id, title, profiles:teacher_id (full_name)`)
                .eq('is_active', true);

            const listEl = document.getElementById('rooms-list');
            if (error || !rooms || rooms.length === 0) {
                listEl.innerHTML = '<p>אין חדרים פעילים כרגע.</p>';
                return;
            }

            listEl.innerHTML = rooms.map(room => `
                <div class="room-item">
                    <span><b>${room.title}</b> (מורה: ${room.profiles?.full_name || 'לא ידוע'})</span>
                    <button onclick="enterRoom('${room.id}', '${room.title}')" style="width: auto; padding: 5px 15px; margin:0;">הכנס לחדר</button>
                </div>
            `).join('');
        }

        window.enterRoom = async function(roomId, roomTitle) {
            currentRoomId = roomId;
            showSection('room-section');
            document.getElementById('current-room-title').innerText = roomTitle;

            await supabase.from('room_participants').upsert([
                { room_id: roomId, user_id: currentUserId }
            ], { onConflict: 'room_id, user_id' });

            fetchParticipants(roomId);

            currentActiveChannel = supabase.channel(`room_${roomId}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'room_participants', filter: `room_id=eq.${roomId}` }, () => {
                    fetchParticipants(roomId);
                })
                .subscribe();
        }

        async function fetchParticipants(roomId) {
            const { data, error } = await supabase
                .from('room_participants')
                .select(`*, profiles:user_id (full_name, role)`)
                .eq('room_id', roomId);

            const ul = document.getElementById('participants-list');
            if (error || !data) return;

            ul.innerHTML = data.map(p => `
                <li>👤 ${p.profiles?.full_name || 'משתמש'} (${p.profiles?.role === 'teacher' ? 'מורה' : 'תלמיד'})</li>
            `).join('');
        }

        window.leaveRoom = async function() {
            if (currentActiveChannel) {
                supabase.removeChannel(currentActiveChannel);
            }
            if (currentRoomId && currentUserId) {
                await supabase.from('room_participants').delete().match({ room_id: currentRoomId, user_id: currentUserId });
            }
            currentRoomId = null;
            showSection('dashboard-section');
            loadActiveRooms();
        }

        function showSection(sectionId) {
            ['auth-section', 'dashboard-section', 'room-section'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
        }
    </script>
