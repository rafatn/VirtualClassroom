<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כיתה וירטואלית חכמה - פרימיום אולטימטיבי</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root[data-theme="light"] {
            --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f8fafc; --card: #ffffff;
            --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --tool: #f1f5f9;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        :root[data-theme="dark"] {
            --primary: #6366f1; --primary-hover: #4f46e5; --bg: #0f172a; --card: #1e293b;
            --text: #f8fafc; --muted: #94a3b8; --border: #334155; --tool: #111827;
            --danger: #f87171; --success: #34d399; --warning: #fbbf24;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2, h3, h4 { color: var(--text); margin-top: 0; }
        .hidden { display: none !important; }
        input, select, button, textarea { display: block; width: 100%; margin-bottom: 12px; padding: 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: var(--card); color: var(--text); outline: none; }
        button { background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .grid-container { display: grid; grid-template-columns: 2fr 1.2fr; gap: 20px; }
        @media (max-width: 900px) { .grid-container { grid-template-columns: 1fr; } }
        .tool-box { background: var(--tool); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        .room-item { background: var(--card); padding: 10px 14px; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        /* עיצוב ייעודי למורה ותלמידים ברשימות ובכרטיסים */
        .participant-card { padding: 10px 14px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .participant-card.teacher { background: rgba(79, 70, 229, 0.1); border-color: var(--primary); }
        .participant-card.student { background: var(--card); }

        .video-container-box { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; position: relative; }
        .video-label { background: rgba(0,0,0,0.85); color: #fff; padding: 6px; font-weight: bold; text-align: center; font-size: 13px; }
        .video-label.teacher-label { background: var(--primary); color: #fff; }
        .video-label.student-label { background: #334155; color: #fff; }

        video { width: 100%; max-height: 220px; background: #000; object-fit: cover; display: block; }
        .chat-box, .transcript-box { height: 100px; overflow-y: auto; border: 1px solid var(--border); padding: 8px; background: var(--card); border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
        #whiteboard-canvas, #pdf-canvas { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; cursor: crosshair; display: block; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        .top-bar-btn { background: var(--muted); color: #fff; padding: 6px 12px; border-radius: 6px; width: auto; display: inline-block; font-size: 14px; }
        .link-btn { background: none; border: none; color: var(--primary); cursor: pointer; text-decoration: underline; width: auto; display: inline; padding: 0; }
        
        @keyframes flashAlert {
            0% { background-color: rgba(239, 68, 68, 0.2); }
            50% { background-color: rgba(239, 68, 68, 0.6); }
            100% { background-color: rgba(239, 68, 68, 0.2); }
        }
        .attention-active { animation: flashAlert 1s infinite; border: 2px solid var(--danger) !important; }
    </style>
</head>
<body>
    <div class="container" id="main-app-container">
        <!-- סרגל עליון -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--primary); margin: 0;" data-i18n="app_title">🎓 כיתה וירטואלית חכמה</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="global-lang-select" class="top-bar-btn" style="margin:0; padding: 5px 10px;" onchange="changeAppLanguage(this.value)">
                    <option value="he">🇮🇱 עברית</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                </select>
                <button class="top-bar-btn" onclick="toggleTheme()" data-i18n="toggle_theme">🌓 מצב כהה / בהיר</button>
            </div>
        </div>

        <!-- התחברות -->
        <div id="auth-section" style="max-width: 400px; margin: 0 auto;">
            <h3 id="form-title" style="text-align: center;" data-i18n="auth_login_title">התחברות למערכת</h3>
            <input type="email" id="email" placeholder="אימייל">
            <input type="password" id="password" placeholder="סיסמה">
            <div id="register-fields" class="hidden">
                <input type="text" id="full_name" placeholder="שם מלא">
                <select id="role">
                    <option value="student">תלמיד 👨‍🎓</option>
                    <option value="teacher">מורה 👨‍🏫</option>
                </select>
            </div>
            <button id="auth-action-btn" onclick="handleAuthSubmit()">התחבר</button>
            <div style="text-align: center;"><button type="button" class="link-btn" onclick="handleForgotPassword()">שכחת סיסמה?</button></div>
            <button onclick="toggleAuthMode()" style="background: var(--muted);">עבור להרשמה / התחברות</button>
        </div>

        <!-- לוח בקרה ראשי -->
        <div id="dashboard-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; background: var(--tool); padding: 15px; border-radius: 8px;">
                <h3 id="welcome-user" style="margin: 0;">שלום</h3>
                <button onclick="logout()" style="background: var(--danger); width: auto; padding: 6px 14px; margin: 0;">התנתק</button>
            </div>
            <hr>
            <div id="teacher-panel" class="hidden tool-box">
                <h4>👨‍🏫 פתיחת חדר חדש</h4>
                <input type="text" id="room-title-input" placeholder="שם השיעור">
                <button onclick="createAndOpenRoom()" style="background: var(--success);">פתח חדר</button>
            </div>
            <div id="student-panel">
                <h4>🏫 חדרים פעילים</h4>
                <div id="rooms-list">טוען חדרים...</div>
            </div>
        </div>

        <!-- חדר המתנה (לתלמיד ממתין לאישור מורה) -->
        <div id="waiting-room-section" class="hidden" style="text-align: center; padding: 40px;">
            <h3 style="color: var(--warning);">⏳ ממתין לאישור המורה להיכנס לשיעור...</h3>
            <p style="color: var(--muted);">המורה יאשר את כניסתך בקרוב.</p>
            <button onclick="leaveRoom()" style="max-width: 200px; margin: 20px auto; background: var(--danger);">בטל ועזוב</button>
        </div>

        <!-- חלון השיעור -->
        <div id="room-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="current-room-title" style="margin: 0; color: var(--primary);">שם החדר</h3>
                <div>
                    <button onclick="leaveRoom()" style="display: inline-block; width: auto; padding: 6px 14px; background: var(--danger);" data-i18n="btn_leave_room">צא מהחדר 🚪</button>
                </div>
            </div>

            <div class="grid-container">
                <div>
                    <!-- וידאו מקומי -->
                    <div class="video-container-box">
                        <video id="local-video" autoplay muted></video>
                        <div id="video-user-label" class="video-label student-label">טוען שם...</div>
                    </div>
                    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                        <button id="toggle-cam-btn" onclick="toggleMyCamera()" style="background: var(--warning); color: #000; padding: 8px;">📷 כבה מצלמה</button>
                        <button id="toggle-mic-btn" onclick="toggleMyMicrophone()" style="background: var(--warning); color: #000; padding: 8px;">🎤 השתק מיקרופון</button>
                    </div>

                    <!-- לוח לבן -->
                    <div class="tool-box">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <h4 style="margin: 0;">🎨 לוח לבן שיתופי</h4>
                            <button onclick="clearWhiteboard()" style="width: auto; padding: 5px 10px; margin: 0; background: var(--danger);">נקה</button>
                        </div>
                        <canvas id="whiteboard-canvas" height="200"></canvas>
                    </div>
                </div>

                <div>
                    <!-- פאנל ניהול תלמידים ממתינים (למורה בלבד) -->
                    <div class="tool-box hidden" id="teacher-waiting-box">
                        <h4 style="margin-bottom: 8px; color: var(--warning);">⏳ תלמידים ממתינים לאישור כניסה</h4>
                        <div id="waiting-students-list">אין תלמידים ממתינים.</div>
                    </div>

                    <!-- רשימת משתתפים (עם צבעים מובחנים למורה ולתלמידים) -->
                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">👥 משתתפים בכיתה</h4>
                        <div id="participants-list" style="max-height: 250px; overflow-y: auto;"></div>
                    </div>

                    <!-- צ'אט כיתתי -->
                    <div class="tool-box">
                        <h4 style="margin-bottom: 8px;">💬 צ'אט כיתתי</h4>
                        <div id="chat-messages" class="chat-box"></div>
                        <input type="text" id="chat-input" placeholder="הקלד הודעה...">
                        <button onclick="sendChatMessage()" style="padding: 6px;">שלח</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient('https://ufivtmlumzhdsljjckqv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmaXZ0bWx1bXpoZHNsampja3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MzIxMjEsImV4cCI6MjEwMzUwODEyMX0.qW-A_JdOZifQtkAmPku6XJWDV-_AVfI8M8GGMdSNLIw');

        // משתני גלובליים למצב המשתמש
        let currentUser = null;
        let currentRoomId = null;
        let isTeacher = false;
        let localStream = null;

        window.toggleAuthMode = function() {
            const fields = document.getElementById('register-fields');
            const title = document.getElementById('form-title');
            const btn = document.getElementById('auth-action-btn');
            if (fields.classList.contains('hidden')) {
                fields.classList.remove('hidden');
                title.innerText = "הרשמה למערכת";
                btn.innerText = "הירשם";
            } else {
                fields.classList.add('hidden');
                title.innerText = "התחברות למערכת";
                btn.innerText = "התחבר";
            }
        };

        window.handleAuthSubmit = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullNameInput = document.getElementById('full_name').value;
            const roleInput = document.getElementById('role').value;
            const isRegister = !document.getElementById('register-fields').classList.contains('hidden');

            if (isRegister) {
                const { data, error } = await supabase.auth.signUP({
                    email, password,
                    options: { data: { full_name: fullNameInput, role: roleInput } }
                });
                if (error) alert(error.message);
                else { alert("נרשמת בהצלחה! אנא התחבר."); toggleAuthMode(); }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else {
                    currentUser = data.user;
                    checkUserProfileAndLoadDashboard();
                }
            }
        };

        async function checkUserProfileAndLoadDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            const meta = currentUser.user_metadata || {};
            const fullName = meta.full_name || currentUser.email;
            isTeacher = (meta.role === 'teacher');

            document.getElementById('welcome-user').innerText = `שלום, ${fullName} (${isTeacher ? 'מורה 👨‍🏫' : 'תלמיד 👨‍🎓'})`;

            if (isTeacher) {
                document.getElementById('teacher-panel').classList.remove('hidden');
            }
            loadActiveRooms();
        }

        window.logout = async function() {
            await supabase.auth.signOut();
            location.reload();
        };

        window.createAndOpenRoom = async function() {
            const title = document.getElementById('room-title-input').value || "שיעור חדש";
            const { data, error } = await supabase.from('rooms').insert([{ title, teacher_id: currentUser.id, active: true }]).select();
            if (error) { alert("שגיאה ביצירת חדר: " + error.message); return; }
            enterRoom(data[0].id, title);
        };

        async function loadActiveRooms() {
            const { data, error } = await supabase.from('rooms').select('*').eq('active', true);
            const listDiv = document.getElementById('rooms-list');
            if (error || !data || data.length === 0) {
                listDiv.innerHTML = "<p>אין חדרים פעילים כרגע.</p>";
                return;
            }
            listDiv.innerHTML = data.map(r => `
                <div class="room-item">
                    <span>📚 ${r.title}</span>
                    <button onclick="requestJoinRoom('${r.id}', '${r.title}')" style="width: auto; padding: 6px 12px; margin:0; background: var(--success);">הכנס לחדר</button>
                </div>
            `).join('');
        }

        window.requestJoinRoom = async function(roomId, roomTitle) {
            currentRoomId = roomId;
            if (isTeacher) {
                enterRoom(roomId, roomTitle);
            } else {
                // תלמיד נכנס קודם לחדר המתנה וממתין לאישור מורה
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('waiting-room-section').classList.remove('hidden');
                
                // רישום כמשתתף ממתין בבסיס הנתונים או סטטוס pending
                await supabase.from('participants').upsert([{
                    room_id: roomId,
                    user_id: currentUser.id,
                    full_name: currentUser.user_metadata?.full_name || 'תלמיד',
                    role: 'student',
                    status: 'waiting'
                }]);

                listenToMyApproval(roomId);
            }
        };

        function listenToMyApproval(roomId) {
            supabase.channel('waiting-room-' + currentUser.id)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'participants', filter: `user_id=eq.${currentUser.id}` }, payload => {
                    if (payload.new.status === 'approved') {
                        document.getElementById('waiting-room-section').classList.add('hidden');
                        enterRoom(roomId, "שיעור פעיל");
                    }
                }).subscribe();
        }

        async function enterRoom(roomId, title) {
            currentRoomId = roomId;
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('waiting-room-section').classList.add('hidden');
            document.getElementById('room-section').classList.remove('hidden');
            document.getElementById('current-room-title').innerText = title;

            if (isTeacher) {
                document.getElementById('teacher-waiting-box').classList.remove('hidden');
                loadWaitingStudents(roomId);
            }

            // רישום משתתף פעיל
            await supabase.from('participants').upsert([{
                room_id: roomId,
                user_id: currentUser.id,
                full_name: currentUser.user_metadata?.full_name || (isTeacher ? 'מורה' : 'תלמיד'),
                role: isTeacher ? 'teacher' : 'student',
                status: 'approved'
            }]);

            setupMediaAndListeners();
            loadParticipantsList(roomId);
        }

        async function loadWaitingStudents(roomId) {
            const { data } = await supabase.from('participants').select('*').eq('room_id', roomId).eq('status', 'waiting');
            const box = document.getElementById('waiting-students-list');
            if (!data || data.length === 0) {
                box.innerHTML = "אין תלמידים ממתינים.";
                return;
            }
            box.innerHTML = data.map(s => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; background:var(--card); padding:6px; border-radius:4px;">
                    <span>👨‍🎓 ${s.full_name}</span>
                    <button onclick="approveStudent('${s.user_id}')" style="width:auto; padding:3px 8px; margin:0; background:var(--success); font-size:12px;">אשר כניסה</button>
                </div>
            `).join('');
        }

        window.approveStudent = async function(userId) {
            await supabase.from('participants').update({ status: 'approved' }).eq('room_id', currentRoomId).eq('user_id', userId);
            loadWaitingStudents(currentRoomId);
            loadParticipantsList(currentRoomId);
        };

        async function loadParticipantsList(roomId) {
            const { data } = await supabase.from('participants').select('*').eq('room_id', roomId).eq('status', 'approved');
            const listDiv = document.getElementById('participants-list');
            if (!data) return;

            listDiv.innerHTML = data.map(p => {
                const isT = p.role === 'teacher';
                return `
                    <div class="participant-card ${isT ? 'teacher' : 'student'}">
                        <span>${isT ? '👨‍🏫 מורה: ' : '👨‍🎓 תלמיד: '} <strong>${p.full_name}</strong></span>
                        <span style="font-size: 11px; color: var(--muted);">${isT ? 'מנהל שיעור' : 'מחובר'}</span>
                    </div>
                `;
            }).join('');
        }

        async function setupMediaAndListeners() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const localVideo = document.getElementById('local-video');
                localVideo.srcObject = localStream;
                
                const myName = currentUser.user_metadata?.full_name || (isTeacher ? 'מורה' : 'תלמיד');
                const label = document.getElementById('video-user-label');
                label.innerText = myName + (isTeacher ? ' (מורה 👨‍🏫)' : ' (תלמיד 👨‍🎓)');
                label.className = `video-label ${isTeacher ? 'teacher-label' : 'student-label'}`;
            } catch (e) {
                console.warn("לא ניתן לגשת למצלמה/מיקרופון:", e);
            }
        }

        window.leaveRoom = async function() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (currentRoomId && currentUser) {
                await supabase.from('participants').delete().eq('room_id', currentRoomId).eq('user_id', currentUser.id);
            }
            location.reload();
        };

        window.toggleMyCamera = function() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                document.getElementById('toggle-cam-btn').innerText = videoTrack.enabled ? "📷 כבה מצלמה" : "📷 הפעל מצלמה";
            }
        };

        window.toggleMyMicrophone = function() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                document.getElementById('toggle-mic-btn').innerText = audioTrack.enabled ? "🎤 השתק מיקרופון" : "🎤 בטל השתקה";
            }
        };

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !currentRoomId) return;

            const senderName = currentUser.user_metadata?.full_name || 'משתמש';
            await supabase.from('messages').insert([{
                room_id: currentRoomId,
                sender: senderName,
                text: message,
                is_teacher: isTeacher
            }]);
            input.value = '';
        };

        // לוח לבן בסיסי ציור
        const canvas = document.getElementById('whiteboard-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        canvas.addEventListener('mousedown', () => painting = true);
        canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', drawOnWhiteboard);

        function drawOnWhiteboard(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = isTeacher ? '#4f46e5' : '#10b981'; // צבע שונה לציור למורה ולתלמיד

            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        window.clearWhiteboard = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
    </script>
</body>
</html>
